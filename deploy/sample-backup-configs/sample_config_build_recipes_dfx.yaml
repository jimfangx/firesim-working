# U250 DFX examples. Normal build recipes are unaffected: DFX is opt-in via
# enable_pr and is supported only by the xilinx_alveo_u250 bit builder.
rocket_dfx_base:
  PLATFORM: xilinx_alveo_u250
  TARGET_PROJECT: firesim
  TARGET_PROJECT_MAKEFRAG: null
  DESIGN: FireSim
  TARGET_CONFIG: FireSimDfxBestOffsetPrefetchingRocketConfig
  PLATFORM_CONFIG: BaseXilinxAlveoU250Config
  deploy_quintuplet: null
  platform_config_args:
    fpga_frequency: 30
    build_strategy: TIMING
    enable_pr: true
    pr_module_name: ReconfigurablePrefetcher
  post_build_hook: null
  metasim_customruntimeconfig: null
  bit_builder_recipe: bit-builder-recipes/xilinx_alveo_u250.yaml

rocket_dfx_rm_ampm:
  PLATFORM: xilinx_alveo_u250
  TARGET_PROJECT: firesim
  TARGET_PROJECT_MAKEFRAG: null
  DESIGN: FireSim
  TARGET_CONFIG: FireSimDfxAMPMPrefetchingRocketConfig
